# Set slider to zero when it is switched off by home assistant:
  - platform: homeassistant
    id: light_state
    entity_id: light.dimmer_01
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_off: light_state
            then:
              - lvgl.slider.update:
                  id: dimmer_slider
                  value: 0
                  
# ── SENSOR AND COVER STATES FROM HOME ASSISTANT ───────────────────────────────
text_sensor:
  - platform: homeassistant
    id: temp_outdoor
    entity_id: sensor.alpstuga_air_quality_monitor_temperatuur
    on_value:
      then:
        - lvgl.label.update:
            id: temp_outdoor_label
            text: !lambda return x + " °C";
  - platform: homeassistant
    id: temp_outdoor_0
    entity_id: sensor.alpstuga_air_quality_monitor_temperatuur
    on_value:
      then:
        - lvgl.label.update:
            id: temp_outdoor_label_0
            text: !lambda return x + " °C";
  - platform: homeassistant
    id: cover_garage1_state
    entity_id: cover.garage_door_opener_garage_01_tor
    on_value:
      then:
        - lvgl.label.update:
            id: garage1_status_label
            text: !lambda |
              if (x == "open") return std::string("Offen");
              if (x == "closed") return std::string("Geschlossen");
              if (x == "opening") return std::string("Oeffnet...");
              if (x == "closing") return std::string("Schliesst...");
              return std::string("?");
        # Wake the screen when garage door 1 starts opening
        - if:
            condition:
              lambda: 'return x == "opening";'
            then:
              - lvgl.resume:
              - lvgl.widget.redraw:
              - light.turn_on: display_backlight

  - platform: homeassistant
    id: cover_garage2_state
    entity_id: cover.garage_door_opener_garage_02_tor
    on_value:
      then:
        - lvgl.label.update:
            id: garage2_status_label
            text: !lambda |
              if (x == "open") return std::string("Offen");
              if (x == "closed") return std::string("Geschlossen");
              if (x == "opening") return std::string("Oeffnet...");
              if (x == "closing") return std::string("Schliesst...");
              return std::string("?");
              
###########################################################
# Home Assistant brightness sensor
###########################################################

sensor:
  - platform: homeassistant
    id: ha_brightness
    entity_id: light.dimmer_01
    attribute: brightness
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.slider.update:
                  id: dimmer_slider
                  value: !lambda |-
                    return (int)((x / 255.0) * 100);

# ── LVGL UI ───────────────────────────────────────────────────────────────────
#
#  Page 1 layout (480×480):
#
#  ┌──────────────────────────┬──────────────────────┐
#  │                          │  Garage 1            │
#  │   Main light button      │  [Auf]               │
#  │   (250×240)              │  [Stop]              │
#  │                          │  [Zu]                │
#  │                          ├──────────────────────┤
#  ├──────────────────────────│  Garage 2            │
#  │ [G.2] [front] [rear]     │  [Auf]               │
#  │  78×80 each              │  [Stop]              │
#  │                          │  [Zu]                │
#  └──────────────────────────┴──────────────────────┘
#
#  Page 2 layout (480×480):
#
#  ┌────────────────────────────────────────────┐  y=10
#  │  Wassersteckdose       (full-width, h=110) │
#  └────────────────────────────────────────────┘  y=120
#  ┌─────────────────────┬──────────────────────┐  y=130
#  │  17a vor dem Haus   │  17a neben dem Haus  │  h=150
#  └─────────────────────┴──────────────────────┘  y=280
#  ┌─────────────────────┬──────────────────────┐  y=290
#  │  17 vor dem Haus 1  │  17 vor dem Haus 2   │  h=150
#  └─────────────────────┴──────────────────────┘  y=440
#
lvgl:
  on_idle:
    # Turn off the display after 1 minute of inactivity.
    timeout: 5min
    then:
      - light.turn_off: display_backlight
      - lvgl.pause:

  pages:
    # ── PAGE 1: MAIN CONTROL ──────────────────────────────────────────────────
    - id: main_page
      bg_color: 0x0F172A
      bg_opa: COVER
      on_swipe_left:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.next:

      widgets:

        # ── MAIN LIGHT BUTTON (top-left, large) ───────────────────────────────
        - button:
            id: btn_mainlight
            x: 10
            y: 10
            width: 250
            height: 240
            checkable: true
            radius: 18
            border_width: 0
            bg_color: 0x1E3A5F
            checked:
              bg_color: 0x1D4ED8
            pressed:
              bg_color: 0x172F4A
            widgets:
              - label:
                  align: CENTER
                  text: "Dining table"
                  text_font: montserrat_20
                  text_color: 0xE2E8F0
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.mawd_250

        # ── LIGHT BUTTONS ROW (below main button) ─────────────────────────────
        - button:
            id: btn_light_garage2
            x: 10
            y: 258
            width: 78
            height: 80
            checkable: true
            radius: 12
            border_width: 0
            bg_color: 0x1E293B
            text_color: 0x64748B
            checked:
              bg_color: 0x92400E
              text_color: 0xFDE68A
            widgets:
              - label:
                  align: CENTER
                  text: "Light\nSide desk"
                  text_font: montserrat_12
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.plug_livingroom_staandelamp

        - button:
            id: btn_light_front
            x: 96
            y: 258
            width: 78
            height: 80
            checkable: true
            radius: 12
            border_width: 0
            bg_color: 0x1E293B
            text_color: 0x64748B
            checked:
              bg_color: 0x92400E
              text_color: 0xFDE68A
            widgets:
              - label:
                  align: CENTER
                  text: "Light\nBarbara"
                  text_font: montserrat_12
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.0xb40ecfd1a15a0000

        - button:
            id: btn_light_rear
            x: 182
            y: 258
            width: 78
            height: 80
            checkable: true
            radius: 12
            border_width: 0
            bg_color: 0x1E293B
            text_color: 0x64748B
            checked:
              bg_color: 0x92400E
              text_color: 0xFDE68A
            widgets:
              - label:
                  align: CENTER
                  text: "Light\nReading"
                  text_font: montserrat_12
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.plug_switch_power_02

        # ── TEMPERATURE + TIME DISPLAY (below light buttons) ──────────────────
        - obj:
            x: 10
            y: 348
            width: 250
            height: 88
            bg_color: 0x1E293B
            bg_opa: COVER
            radius: 14
            border_width: 0
            pad_all: 10
            widgets:
              # Left column: outdoor temperature
