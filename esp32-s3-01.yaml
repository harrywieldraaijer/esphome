esphome:
  name: esp32-s3-01
  friendly_name: ESP32-S3_01

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret touchscreen_garage_1__encryption_key

ota:
  - platform: esphome
    password: !secret esp32_s3_01__ota_password
    on_begin: # prevent screen flickering during OTA
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret esp32_s3_01__ap_ssid
captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lvgl.label.update:
            id: time_label
            text: !lambda |
              char buf[6];
              auto t = id(ha_time).now();
              snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
              return std::string(buf);
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |
                char buf[6];
                auto t = id(ha_time).now();
                snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
                return std::string(buf);

          - lvgl.label.update:
              id: time_label_0
              text: !lambda |
                char buf[6];
                auto t = id(ha_time).now();
                snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
                return std::string(buf);

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true

display:
  - platform: st7701s
    id: tft_display
    dimensions:
      width: 480
      height: 480
    #    rotation: 270    #uncomment for placement with down-facing USB socket
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: False
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
#    transform:     #uncomment for placement with down-facing USB socket
#      swap_xy: true
#      mirror_x: true
    on_release:
      # Wake up the screen on any touch without triggering buttons.
      # When LVGL is paused it does not process input, so the touch that
      # wakes the screen cannot accidentally click anything underneath.
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: display_backlight

# ── LIGHT STATES FROM HOME ASSISTANT ──────────────────────────────────────────
# Note: main button controls Garage 1 own light (output_0); Garage 2 light is secondary.
binary_sensor:
  - platform: homeassistant
    id: light_main
    entity_id: light.mawd_250
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: btn_mainlight
            state:
              checked: !lambda return x;
              
  - platform: homeassistant
    id: light_main_0
    entity_id: light.relay_sonoff_01
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: btn_mainlight_0
            state:
              checked: !lambda return x;

  - platform: homeassistant
    id: light_garage2
    entity_id: light.plug_livingroom_staandelamp
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: btn_light_garage2
            state:
              checked: !lambda return x;

  - platform: homeassistant
    id: light_front
    entity_id: light.0xb40ecfd1a15a0000
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: btn_light_front
            state:
              checked: !lambda return x;

  - platform: homeassistant
    id: light_rear
    entity_id: light.plug_switch_power_02
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: btn_light_rear
            state:
              checked: !lambda return x;

